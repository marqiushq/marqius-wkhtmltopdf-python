# Keeps marqius-wkhtmltopdf on PyPI on the latest release, and proves it first:
#
#   every hour     when marqius-wkhtmltopdf's latest GitHub release is newer than the package, each
#                  build is checked against its published SHA-256 and GitHub build provenance, and a
#                  wheel is made for each platform. pip installs
#                  them, as the README prints it, and python-pdfkit, django-wkhtmltopdf and imgkit
#                  make files with them on Linux (x86-64 and ARM64), macOS (Apple silicon) and
#                  Windows. Only then are they published, the version committed and tagged, and the
#                  README's lines run again from PyPI itself. An hour with no new release ends
#                  after that first check: there is nothing new to test.
#   own versions   a fourth number is a change to the package alone: 0.12.13.1 carries the program
#                  of release 0.12.13. Set __version__ to it and run the workflow by hand.
#   by hand        Actions > Release > Run workflow: the same, now; it also publishes the package's
#                  own release if PyPI lacks it, which is how the first release goes out
#   on a change    to main, or in a pull request: the package as it stands, on the same four
#   while private  the hourly check does not run
#   publishing     only from a public repository whose variable PUBLISHING is "on"
name: Release

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: "Test on GitHub's macOS too (off only while GitHub has no Mac, and the macOS checks were run on a Mac elsewhere)"
        type: boolean
        default: true
      dry_run:
        description: "Rehearsal: build and test the latest marqius-wkhtmltopdf release as if it were new, even if PyPI has it; publish nothing"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # a rehearsal neither waits behind a run that publishes nor takes its place
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  follow:
    # while the repository is private, the hourly check does not run (it would spend private minutes)
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.follow.outputs.publish }}
      version: ${{ steps.follow.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius-wkhtmltopdf's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          have=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' marqius_wkhtmltopdf/__init__.py)
          publish=false target=$have
          if [ "$DRY_RUN" = true ]; then
            # a rehearsal: the latest release, built and tested as if it were new; the publish job is skipped
            latest=$(python3 .github/release.py latest)
            publish=true target=$latest
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            latest=$(python3 .github/release.py latest)
            if python3 .github/release.py newer "$latest" "$have"; then
              publish=true target=$latest
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$(curl -fsS "https://pypi.org/pypi/marqius-wkhtmltopdf/$have/json" 2>/dev/null | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["urls"]))' 2>/dev/null)" != 4 ]; then
              publish=true # run by hand, and PyPI lacks the package's own release (or one of its wheels): the first one
            fi
          fi
          echo "package $have, latest release ${latest:-not asked}: publish=$publish version=$target"
          printf 'publish=%s\nversion=%s\n' "$publish" "$target" >>"$GITHUB_OUTPUT"
      - name: Check the release's builds and make the wheels
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.follow.outputs.version }}
        run: |
          # a fourth number is the package's own: 0.12.13.1 carries the program of release 0.12.13
          program=$(echo "$VERSION" | cut -d. -f1-3)
          python3 .github/release.py fetch "$program" "$RUNNER_TEMP/builds"
          python3 build.py "$VERSION" "$RUNNER_TEMP/builds" dist
          # the same wheels as a newer version, never published: what `marqius-wkhtmltopdf update` must find
          python3 build.py "$VERSION.99" "$RUNNER_TEMP/builds" next
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-next
          path: next/*.whl
          retention-days: 7

  test:
    needs: follow
    # every hour, only when there is a release to publish: the other hours have nothing new to test
    if: github.event_name != 'schedule' || needs.follow.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        # (macOS left out only when a run by hand says so: GitHub had no Mac, and it was checked on one elsewhere)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos == false && '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-next
          path: next
      - if: runner.os == 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: |
            3.8
            3.14
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the wheel, and make files with each library
        env:
          EXPECT_VERSION: ${{ needs.follow.outputs.version }}
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          python -m pip install -q --disable-pip-version-check twine
          python -m twine check --strict dist/*.whl
          PIP_FIND_LINKS="$GITHUB_WORKSPACE/dist" PYTHON=python tests/examples.sh "$tmp/w"
      - name: marqius-wkhtmltopdf update finds a newer version and installs it
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          PIP_FIND_LINKS="$GITHUB_WORKSPACE/dist $GITHUB_WORKSPACE/next" UPDATE_FROM="$VERSION" UPDATE_TO="$VERSION.99" \
            PYTHON=python tests/examples.sh "$tmp/u" update
      - name: The oldest and newest Python the package names, 3.8 and 3.14
        if: runner.os == 'Linux'
        run: |
          for v in 3.8 3.14; do
            PIP_FIND_LINKS="$GITHUB_WORKSPACE/dist" PYTHON=python$v tests/examples.sh "$RUNNER_TEMP/py$v" pdfkit django-wkhtmltopdf imgkit typed
          done
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}

  publish:
    needs: [follow, test]
    if: >-
      needs.follow.outputs.publish == 'true' && github.ref == 'refs/heads/main' &&
      vars.PUBLISHING == 'on' && !github.event.repository.private && !inputs.dry_run
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: write
      id-token: write # PyPI's trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
      - name: Commit and tag the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
        run: |
          mac="macOS (Apple silicon)"
          [ "$MACOS" = false ] && mac="macOS (Apple silicon, on a Mac outside GitHub, which had none free)"
          sed -i "s/^__version__ = \".*\"$/__version__ = \"$VERSION\"/" marqius_wkhtmltopdf/__init__.py
          grep -qx "__version__ = \"$VERSION\"" marqius_wkhtmltopdf/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- marqius_wkhtmltopdf/__init__.py; then
            git add marqius_wkhtmltopdf/__init__.py
            git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed with pip and run through python-pdfkit, django-wkhtmltopdf and imgkit on Linux (x86-64, ARM64), $mac and Windows, then published: $RUN_URL"
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/$VERSION")" ]; then
            git tag -a "$VERSION" -m "marqius-wkhtmltopdf $VERSION" -m "Tested and published: $RUN_URL"
            git push -q origin "refs/tags/$VERSION"
          fi
          git push -q origin HEAD:main

  live:
    needs: [follow, publish]
    strategy:
      fail-fast: false
      matrix:
        # (macOS left out only when a run by hand says so: GitHub had no Mac, and it was checked on one elsewhere)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.macos == false && '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.follow.outputs.version }}
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Wait for PyPI to serve the release
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          # the index pip reads, asked as pip asks: its wheel for this version must be listed
          for _ in $(seq 120); do
            curl -fsS -H 'Accept: application/vnd.pypi.simple.v1+json' "https://pypi.org/simple/marqius-wkhtmltopdf/" 2>/dev/null | grep -q "marqius_wkhtmltopdf-$VERSION-" && exit 0
            sleep 10
          done
          echo "PyPI does not serve marqius-wkhtmltopdf $VERSION after 20 minutes" >&2
          exit 1
      - name: The README's lines, as printed, from PyPI
        env:
          EXPECT_VERSION: ${{ needs.follow.outputs.version }}
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          # PyPI's servers can answer with the page from before the release for a few minutes: again
          # every 15 seconds, without pip's cache, for up to ten minutes
          PYTHON=python tests/examples.sh "$tmp/live" && exit 0
          deadline=$((SECONDS + 600)) try=1
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 15
            try=$((try + 1))
            echo "Trying again ($try), in case a PyPI server still had the older index" >&2
            PYTHON=python PIP_NO_CACHE_DIR=1 tests/examples.sh "$tmp/live-$try" && exit 0
          done
          exit 1
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
